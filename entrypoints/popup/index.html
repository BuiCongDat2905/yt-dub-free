<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>YT Dub Free</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>YT Dub Free</h1>
    <p class="hint">Lồng tiếng YouTube sang tiếng Việt. Bật/tắt nhanh bằng <kbd>Alt</kbd> + <kbd>D</kbd>.</p>

    <label class="row">
      <span>Tiếng gốc</span>
      <input id="original-volume" type="range" min="0" max="1" step="0.05" />
      <output id="original-value">0.10</output>
    </label>

    <label class="row">
      <span>Tiếng lồng</span>
      <input id="dub-volume" type="range" min="0" max="1" step="0.05" />
      <output id="dub-value">1.00</output>
    </label>

    <label class="row">
      <span>Giọng đọc</span>
      <select id="voice-engine">
        <option value="piper">Piper offline (nữ, thử nghiệm)</option>
        <option value="google">Google (nữ, online)</option>
      </select>
    </label>

    <label class="row checkbox">
      <input id="subtitle" type="checkbox" />
      <span>Hiện phụ đề tiếng Việt</span>
    </label>

    <label class="row checkbox">
      <input id="enabled" type="checkbox" />
      <span>Tự bật khi mở video</span>
    </label>

    <div class="row buttons">
      <button id="open-editor" type="button">Sửa bản dịch hiện tại</button>
    </div>

    <div class="row buttons">
      <button id="download-log" type="button">Tải log lỗi</button>
      <button id="clear-log" type="button">Xoá log</button>
    </div>

    <p id="status" class="status">Đang đọc cài đặt…</p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
